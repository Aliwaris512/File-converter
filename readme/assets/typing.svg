<svg xmlns="http://www.w3.org/2000/svg" width="900" height="64" viewBox="0 0 900 64" role="img" aria-labelledby="title">
  <title id="title">Offline-first file conversion, with files kept on your device</title>
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="898" height="62" rx="14" fill="#F5F7FF" stroke="#C7D2FE"/>
  <circle cx="34" cy="32" r="7" fill="url(#accent)"/>
  <text x="56" y="38" fill="#312E81" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
    Convert images, PDFs, documents &amp; spreadsheets — files stay on your device.
  </text>
</svg>
