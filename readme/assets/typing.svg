<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56">
  <style>
    text{font:600 22px 'Courier New',Consolas,monospace;fill:#4F46E5}
    @media (prefers-color-scheme:dark){text{fill:#A5B4FC}}
    .l{opacity:0}
    .l1{animation:s 16s infinite}
    .l2{animation:s 16s infinite 4s}
    .l3{animation:s 16s infinite 8s}
    .l4{animation:s 16s infinite 12s}
    @keyframes s{0%{opacity:1;clip-path:inset(0 100% 0 0)}12%{clip-path:inset(0 0 0 0)}22%{opacity:1;clip-path:inset(0 0 0 0)}25%,100%{opacity:0;clip-path:inset(0 0 0 0)}}
    .cur{animation:b .8s steps(1) infinite}
    @keyframes b{50%{opacity:0}}
  </style>
  <g transform="translate(450,36)">
    <text class="l l1" text-anchor="middle">&gt; Convert images, PDFs, docs &amp; sheets</text>
    <text class="l l2" text-anchor="middle">&gt; Files never leave your machine</text>
    <text class="l l3" text-anchor="middle">&gt; Right-click any file in Explorer</text>
    <text class="l l4" text-anchor="middle">&gt; No uploads. No cloud. No surprises.</text>
  </g>
</svg>
