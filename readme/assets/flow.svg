<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
  </defs>
  <style>
    .box{fill:#fff;stroke:url(#g);stroke-width:2.5}
    .h{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#312E81}
    .t{font:500 12.5px 'Segoe UI',Arial,sans-serif;fill:#4B5563}
    .lock{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#059669}
    .line{stroke:#A5B4FC;stroke-width:2.5;stroke-dasharray:6 6;fill:none;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
    .bob{animation:bob 3s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    .glow{animation:glow 2.4s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <rect width="900" height="230" rx="16" fill="#F5F7FF"/>
  <path id="p1" class="line" d="M255 100 H345"/>
  <path id="p2" class="line" d="M555 100 H645"/>
  <g class="bob"><rect class="box" x="60" y="50" width="195" height="100" rx="14"/>
    <text class="h" x="157" y="92" text-anchor="middle">Your file</text>
    <text class="t" x="157" y="115" text-anchor="middle">png · pdf · docx · csv…</text></g>
  <g class="bob" style="animation-delay:-1s"><rect class="box" x="345" y="50" width="210" height="100" rx="14"/>
    <text class="h" x="450" y="86" text-anchor="middle">Local engine</text>
    <text class="t" x="450" y="108" text-anchor="middle">Pillow · ReportLab · PyMuPDF</text>
    <text class="t" x="450" y="126" text-anchor="middle">LibreOffice · FFmpeg</text></g>
  <g class="bob" style="animation-delay:-2s"><rect class="box" x="645" y="50" width="195" height="100" rx="14"/>
    <text class="h" x="742" y="92" text-anchor="middle">New output</text>
    <text class="t" x="742" y="115" text-anchor="middle">saved beside the input</text></g>
  <circle r="6" fill="#4F46E5"><animateMotion dur="2s" repeatCount="indefinite" path="M255 100 H345"/></circle>
  <circle r="6" fill="#0EA5E9"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M555 100 H645"/></circle>
  <circle r="6" fill="#4F46E5" opacity=".6"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M255 100 H345"/></circle>
  <circle r="6" fill="#0EA5E9" opacity=".6"><animateMotion dur="2s" repeatCount="indefinite" path="M555 100 H645"/></circle>
  <g class="glow"><text class="lock" x="450" y="195" text-anchor="middle">🔒 100% local — nothing is uploaded</text></g>
</svg>
